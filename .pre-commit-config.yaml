# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      - id: validate-policy-cards
        name: Validate Policy Cards against schema
        entry: python "Governance/GovernanceScripts/Validation/validate_policy_cards.py"
        language: system
        files: ^Governance/Policy-cards/.*\.yaml$
        pass_filenames: true
        
      - id: lint-dead-references
        name: Lint dead references in .md files
        entry: python "Governance/GovernanceScripts/Validation/lint_dead_references.py"
        language: system
        files: \.md$
        pass_filenames: true
        
      - id: validate-frontmatter
        name: Validate YAML frontmatter on governance files
        entry: python "Governance/GovernanceScripts/Validation/validate_frontmatter.py"
        language: system
        files: ^(\.devin/agents|Governance|workflows)/.*\.md$
        pass_filenames: true
