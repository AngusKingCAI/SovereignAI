[project]
name = "sovereignai-harness"
version = "1.0.0"
description = "Rule-Adherence-First Harness for Devin CLI"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# Governor.py optional dependencies (per v1.5 spec Appendix O)
governor-locking = ["portalocker>=2.0.0"]
governor-yaml = ["strictyaml>=1.0.0"]
governor-validation = ["pydantic>=2.0.0"]
governor-logging = ["structlog>=23.0.0"]
governor-debugging = ["portalocker>=2.0.0", "structlog>=23.0.0"]
governor-all = [
    "portalocker>=2.0.0",
    "strictyaml>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
]
basic = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
