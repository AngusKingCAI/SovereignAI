# Sample Rule: Enforce Architecture Patterns
# This rule enforces architectural patterns by detecting violations
# and suggesting corrective actions

id: enforce_architecture_patterns
version: "1.0.0"
tier: warning
agent: all
domain: planning
name: Enforce Architecture Patterns
description: Enforces architectural patterns and detects violations
triggers:
  - PreToolUse
  - PostToolUse
check:
  params:
    actions:
      - name: block_command
        reason: Architectural pattern violation detected
