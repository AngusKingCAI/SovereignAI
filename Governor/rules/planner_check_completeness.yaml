# Planner-Specific Rule: Enforce Plan Completeness
# This rule ensures plan completeness before execution

id: planner_check_completeness
version: "1.0.0"
tier: warning
agent: planner
domain: planning
name: Check Plan Completeness
description: Warns if plan lacks required sections
triggers:
  - UserPromptSubmit
check:
  params:
    actions:
      - name: block_command
        reason: Plan completeness check failed
