id: block_destructive_commands
version: "1.0.0"
tier: blocking
name: block_destructive_commands
description: Blocks destructive commands (rm -rf, Remove-Item -Recurse -Force) and requires explicit bypass
triggers:
  - PreToolUse
check:
  params:
    actions:
      - type: block_command
        params:
          reason: "Destructive command blocked by policy"
          allow_bypass: true
