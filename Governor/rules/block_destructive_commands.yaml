# Sample Rule: Block Destructive Commands
# This rule blocks destructive commands (file deletion, force operations)
# in early phases to prevent accidental data loss

id: block_destructive_commands
version: "1.0.0"
tier: blocking
agent: all
domain: execution
name: Block Destructive Commands
description: Blocks destructive tool operations in early phases
triggers:
  - PreToolUse
check:
  params:
    actions:
      - name: block_command
        reason: Destructive operations blocked in early phases for safety
