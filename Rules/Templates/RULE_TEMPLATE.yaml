# Rules/Templates/RULE_TEMPLATE.yaml
# Standard rule template for creating new governance rules
# Copy this file and rename it to RULE-XX-name.yaml
# REQUIRED FIELDS - all rules must have these
id: RULE-ID
version: "1.0.0"
tier: safety|compliance|quality
severity: blocking|advisory
agent: all|agent-name
domain: domain-name
constitutional_basis: CONS-XXX

rule:
  statement: "Standardized rule statement"
  rationale: "Standardized rule rationale"

enforceable_via: hook|validator|both

check:
  params:
    # REQUIRED FIELDS - all rules must have these
    target_tools: ["exec", "write", "edit"]
    message: "standardized violation message"
    
    # OPTIONAL FIELDS - include only what your rule needs
    patterns:
      - regex: "pattern"
        reason: "specific reason"
    scope_dirs: ["dir1", "dir2"]
    exemptions: ["pattern1", "pattern2"]
    required_fields: ["field1", "field2"]
    forbidden: ["pattern1", "pattern2"]
    file_glob: "**/*.md"
    field_values: {field: value}
    check_encoding: false
    check_frontmatter: false

test_cases:
  - name: "test case name"
    input: "test input"
    expected: pass
  - name: "another test case"
    input: "another input"
    expected: fail

exemptions:
  - "README.md"
  - "CHANGELOG.md"
