# Rules/Shared/SHR-01-safety-commands.yaml
id: SHR-01
version: "1.0.0"
tier: safety
severity: blocking
agent: all
domain: destructive-commands
constitutional_basis: SAFE-001

rule:
  statement: "Block destructive shell commands unless user has explicitly confirmed"
  rationale: "rm, rm -rf, DROP TABLE, git push --force, git restore, git fetch can destroy irreversible work and cause conflicts"

enforceable_via: hook

check:
  params:
    target_tools: ["exec"]
    message: "safety command requires explicit user confirmation"
    scope_dirs: ["Tests Temp"]
    patterns:
      - regex: "^rm\\s+-rf?\\s+"
        reason: "rm -rf requires explicit user confirmation"
      - regex: "^rm\\s+"
        reason: "rm command requires explicit user confirmation"
      - regex: "DROP\\s+TABLE"
        reason: "DROP TABLE requires explicit user confirmation"
      - regex: "git\\s+push\\s+.*--force"
        reason: "git push --force requires explicit user confirmation"
      - regex: "git\\s+restore"
        reason: "git restore requires explicit user confirmation"
      - regex: "git\\s+fetch"
        reason: "git fetch requires explicit user confirmation"
      - regex: "^:\\(\\)\\s*\\{.*\\|.*&\\s*\\};:"
        reason: "fork bomb pattern requires explicit user confirmation"

test_cases:
  - name: "blocks rm -rf"
    input: "rm -rf /tmp/test"
    expected: deny
  - name: "blocks rm -rf with path"
    input: "rm -rf Governance/Tests/"
    expected: deny
  - name: "blocks standard rm"
    input: "rm single_file.txt"
    expected: deny
  - name: "blocks git restore"
    input: "git restore file.txt"
    expected: deny
  - name: "blocks git fetch"
    input: "git fetch origin"
    expected: deny
  - name: "blocks git push --force"
    input: "git push origin main --force"
    expected: deny

exemptions: []
