# Rules/Shared/SHR-03-frontmatter.yaml
id: SHR-03
version: "1.0.0"
tier: compliance
severity: blocking
agent: all
domain: frontmatter
constitutional_basis: COMP-001

rule:
  statement: "Every governance .md file must have YAML frontmatter with required fields"
  rationale: "Frontmatter is the machine-readable metadata that validators and hooks depend on"

enforceable_via: both

check:
  params:
    target_tools: ["write", "edit"]
    message: "missing required YAML frontmatter requires explicit user confirmation"
    file_glob: "**/*.md"
    scope_dirs: [".devin/agents", "Rules", "workflows"]
    required_fields: [id, version, owner, updated, purpose, agent, persona]
    check_frontmatter: true

test_cases:
  - name: "valid frontmatter with all required fields"
    input: "---\nid: test\nversion: \"1.0.0\"\nowner: SovereignAI\nupdated: 2026-08-02\npurpose: Test\nagent: all\npersona: governance\n---\n\nTest content"
    expected: pass
  - name: "missing persona field"
    input: "---\nid: test\nversion: \"1.0.0\"\n---\n\nTest content"
    expected: fail
  - name: "no frontmatter at all"
    input: "Test content without frontmatter"
    expected: fail

exemptions:
  - "README.md"
  - "CHANGELOG.md"
  - "Docs/**/*.md"
  - "Rules/**/*.yaml"
  - "Rules/**/*.yml"
