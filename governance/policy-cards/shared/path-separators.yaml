# governance/policy-cards/shared/path-separators.yaml
id: SHARED-003
version: "1.0.0"
tier: compliance
severity: advisory
agent: all
domain: path-format
constitutional_basis: COMP-001

rule:
  statement: "Use forward slash path separators, never backslash or absolute paths"
  rationale: "Cross-platform compatibility requires consistent path separators"

enforceable_via: hook

check:
  type: custom_function
  params:
    function: checks.path_separator_check

test_cases:
  - name: "allows forward slash path"
    input: "path/to/file.txt"
    expected: allow
  - name: "allows relative path"
    input: "./scripts/test.py"
    expected: allow
  - name: "allows script path"
    input: "scripts/enforcement/test.py"
    expected: allow

exemptions:
  - "tests/fixtures/*"
