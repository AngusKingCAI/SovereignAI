# Governance/Policy-cards/Shared/SHR-01-safety-commands.yaml
id: SHR-01
version: "1.0.0"
tier: safety
severity: blocking
agent: all
domain: destructive-commands
constitutional_basis: SAFE-001

rule:
  statement: "Block destructive shell commands unless user has explicitly confirmed"
  rationale: "rm, rm -rf, DROP TABLE, git push --force, git restore, git fetch can destroy irreversible work and cause conflicts"

enforceable_via: hook

check:
  type: deny_command
  params:
    patterns:
      - regex: "^rm\\s+-rf?\\s+"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: rm -rf requires explicit user confirmation"
      - regex: "^rm\\s+"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: rm command requires explicit user confirmation"
      - regex: "DROP\\s+TABLE"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: DROP TABLE requires explicit user confirmation"
      - regex: "git\\s+push\\s+.*--force"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: git push --force requires explicit user confirmation"
      - regex: "git\\s+restore"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: git restore requires explicit user confirmation"
      - regex: "git\\s+fetch"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: git fetch requires explicit user confirmation"
      - regex: "^:\\(\\)\\s*\\{.*\\|.*&\\s*\\};:"
        action: deny
        reason: "⛔ BLOCKED by rule SHR-01: fork bomb pattern requires explicit user confirmation"

test_cases:
  - name: "blocks rm -rf"
    input: "rm -rf /tmp/test"
    expected: deny
  - name: "blocks rm -rf with path"
    input: "rm -rf Governance/Tests/"
    expected: deny
  - name: "blocks standard rm"
    input: "rm single_file.txt"
    expected: deny
  - name: "blocks git restore"
    input: "git restore file.txt"
    expected: deny
  - name: "blocks git fetch"
    input: "git fetch origin"
    expected: deny
  - name: "blocks git push --force"
    input: "git push origin main --force"
    expected: deny
